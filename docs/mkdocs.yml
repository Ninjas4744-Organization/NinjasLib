site_name: NinjasLib
site_description: Guides and manuals for NinjasLib, Team 4744's shared FRC library.
site_url: https://ninjas4744-organization.github.io/NinjasLib/
repo_url: https://github.com/Ninjas4744-Organization/NinjasLib
repo_name: NinjasLib
docs_dir: _src
site_dir: .mkdocs-build
use_directory_urls: false

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: he
          name: עברית
          build: true
          nav_translations:
            Home: בית
            Getting Started: איך מתחילים
            Guides: מדריכים
            Swerve Drive: שילדת סוורב
            Motor Controllers: בקרי מנועים
            State Machines: מכונות מצבים
            Localization & Vision: מיקום וראייה ממוחשבת
            Gamepad (LoggedCommandController): שלט (LoggedCommandController)
            Logged Digital Input: כניסה דיגיטלית מתועדת
            Commands: פקודות
            Utilities: כלי עזר

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Swerve Drive: guides/swerve.md
      - Motor Controllers: guides/controllers.md
      - State Machines: guides/state-machine.md
      - Localization & Vision: guides/localization.md
      - Gamepad (LoggedCommandController): guides/logged-controller.md
      - Logged Digital Input: guides/logged-digital-input.md
      - Commands: guides/commands.md
      - Utilities: guides/utilities.md
  - Javadoc: javadoc/index.html

extra:
  social: []
